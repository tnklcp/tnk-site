# netlify.toml (MUST be at repo root)

[build]
  base = "tnk-site"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty URLs for portal pages
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

[[redirects]]
  from = "/employee"
  to = "/employee.html"
  status = 301

[[redirects]]
  from = "/customer"
  to = "/customer.html"
  status = 301

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/login-customer"
  to = "/login-customer.html"
  status = 301

# Optional: make sure direct portal URLs work if you ever add client-side routing later
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
