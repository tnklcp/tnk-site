# netlify.toml at repo root (since the site lives at repo root)
[build]
  publish = "."

# Pretty URLs for your portal pages
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

[[redirects]]
  from = "/employee"
  to = "/employee.html"
  status = 301

[[redirects]]
  from = "/customer"
  to = "/customer.html"
  status = 301

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/login-customer"
  to = "/login-customer.html"
  status = 301

