<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <p>View invoices and account details.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <a class="button button--accent" href="customer-signup.html">Create Account</a>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:520px">
      <!-- Keep your existing (placeholder) login form -->
      <form id="login-form" action="/api/auth/login-customer" method="POST" novalidate>
        <label for="l_user">Email</label>
        <input id="l_user" name="username" type="email" required autocomplete="username" />

        <label for="l_pass">Password</label>
        <input id="l_pass" type="password" name="password" required autocomplete="current-password" />

        <div class="form-actions">
          <p id="login-status" role="status" aria-live="polite"></p>
          <button class="button button--primary button--xl" type="submit">
            <span class="btn-icon" aria-hidden="true">🔑</span>
            <span>Sign In</span>
          </button>
        </div>
      </form>

      <p class="muted" style="text-align:center;margin-top:1rem;">
        New here? <a href="customer-signup.html">Create your account</a>.
      </p>
    </div>
  </section>

  <script>
    // Basic client-side handler (you can replace with real auth later)
    const form = document.getElementById('login-form');
    const statusEl = document.getElementById('login-status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Signing in...';
      try {
        const body = new URLSearchParams(new FormData(form));
        const res = await fetch(form.action, {
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body
        });
        const data = await res.json().catch(()=>({}));
        if (res.ok && data.ok && data.user) {
          statusEl.textContent = 'Success. Redirecting...';
          // Demo: remember who signed in
          sessionStorage.setItem('tnk_user_email', data.user.email || document.getElementById('l_user').value);
          setTimeout(()=> location.href = 'customer.html', 300);
        } else {
          statusEl.textContent = (data && data.error) ? data.error : 'Invalid credentials (demo server not connected).';
        }
      } catch {
        statusEl.textContent = 'Network error';
      }
    });
  </script>
</body>
</html>
