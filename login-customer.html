<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <p>View invoices and account details.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <a class="button button--accent" href="customer-signup.html">Create Account</a>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:520px">
      <form id="login-form" novalidate>
        <label for="l_user">Email</label>
        <input id="l_user" name="username" type="email" required autocomplete="username" />

        <label for="l_pass">Password</label>
        <input id="l_pass" type="password" name="password" required autocomplete="current-password" />

        <div class="form-actions">
          <p id="login-status" role="status" aria-live="polite"></p>
          <button class="button button--primary button--xl" type="submit">
            <span class="btn-icon" aria-hidden="true">🔑</span>
            <span>Sign In</span>
          </button>
        </div>
      </form>

      <div class="cta-row" style="justify-content:center;margin-top:1rem;">
        <button id="btn-widget" class="button">Use Identity Widget</button>
        <a id="btn-forgot" class="button" href="#">Forgot Password</a>
      </div>

      <p class="muted" style="text-align:center;margin-top:1rem;">
        Tip: Email confirmation is OFF—accounts can sign in immediately.
      </p>
    </div>
  </section>

  <!-- Identity libraries -->
  <script src="https://cdn.jsdelivr.net/npm/gotrue-js@2.3.0/dist/gotrue.min.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Inline minimal Identity helper (replaces js/identity.js) -->
  <script>
    window.TNKIdentity = (function () {
      const APIUrl = window.location.origin + '/.netlify/identity';
      let auth;
      function ensureAuth() {
        if (auth) return auth;
        if (!window.GoTrue) throw new Error('GoTrue library not loaded');
        auth = new GoTrue({ APIUrl, setCookie: true });
        return auth;
      }
      async function currentUser() {
        try { return await ensureAuth().currentUser(); }
        catch { return null; }
      }
      async function login(email, password) {
        try {
          const user = await ensureAuth().login(email, password, true);
          return { ok: true, user };
        } catch (e) {
          let msg = e?.message || 'Login failed';
          if (/confirm/i.test(msg)) msg = 'Please confirm your email before signing in.';
          if (/invalid|Unauthorized/i.test(msg)) msg = 'Invalid email or password.';
          return { ok: false, error: msg };
        }
      }
      async function requestPasswordRecovery(email) {
        try { await ensureAuth().requestPasswordRecovery(email); return { ok: true }; }
        catch (e) { return { ok: false, error: e?.message || 'Unable to send reset email.' }; }
      }
      return { APIUrl, currentUser, login, requestPasswordRecovery };
    })();
  </script>

  <!-- Page logic -->
  <script>
    const statusEl = document.getElementById('login-status');
    const form = document.getElementById('login-form');
    const btnWidget = document.getElementById('btn-widget');
    const btnForgot = document.getElementById('btn-forgot');
    const DEST = '/customer.html'; // absolute path

    // Robust redirect helper: poll currentUser briefly to wait for cookie
    async function redirectWhenLoggedIn(timeoutMs = 6000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        try {
          const user = await TNKIdentity.currentUser();
          if (user) {
            try { sessionStorage.setItem('tnk_user_email', user.email || ''); } catch {}
            window.location.replace(DEST);
            return true;
          }
        } catch {}
        await new Promise(r => setTimeout(r, 350));
      }
      return false;
    }

    // Init widget + events (widget path)
    if (window.netlifyIdentity) {
      netlifyIdentity.on('init', async (user) => {
        console.log('[Identity] init user:', user);
        if (user) {
          try { sessionStorage.setItem('tnk_user_email', user.email || ''); } catch {}
          window.location.replace(DEST);
        }
      });
      netlifyIdentity.on('login', async (user) => {
        statusEl.textContent = 'Signing you in…';
        try { sessionStorage.setItem('tnk_user_email', user.email || ''); } catch {}
        const ok = await redirectWhenLoggedIn(4000);
        if (!ok) window.location.replace(DEST);
      });
      netlifyIdentity.on('close', async () => {
        await redirectWhenLoggedIn(2000);
      });
      netlifyIdentity.init(); // IMPORTANT
    }

    // Already logged in? Go now. (form path)
    (async function autoGo() {
      await redirectWhenLoggedIn(1000);
    })();

    // Email+password login via GoTrue (form path)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Signing in…';
      const email = document.getElementById('l_user').value.trim();
      const password = document.getElementById('l_pass').value;
      const res = await TNKIdentity.login(email, password);
      if (res.ok) {
        try { sessionStorage.setItem('tnk_user_email', email); } catch {}
        const ok = await redirectWhenLoggedIn(3000);
        if (!ok) window.location.replace(DEST);
      } else {
        statusEl.textContent = res.error || 'Login failed.';
      }
    });

    // Open widget explicitly
    btnWidget.addEventListener('click', () => {
      if (window.netlifyIdentity) netlifyIdentity.open('login');
      else alert('Identity widget not available.');
    });

    // Password reset
    btnForgot.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Enter your account email to reset password:');
      if (!email) return;
      const res = await TNKIdentity.requestPasswordRecovery(email.trim());
      alert(res.ok ? 'Check your email for a reset link.' : (res.error || 'Unable to send reset email.'));
    });

    // Debug
    console.log('[Identity] API URL:', TNKIdentity.APIUrl);
  </script>
</body>
</html>
