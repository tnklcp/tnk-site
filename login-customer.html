<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <p>View invoices and account details.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <a class="button button--accent" href="customer-signup.html">Create Account</a>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:520px">
      <form id="login-form" novalidate>
        <label for="l_user">Email</label>
        <input id="l_user" name="username" type="email" required autocomplete="username" />

        <label for="l_pass">Password</label>
        <input id="l_pass" type="password" name="password" required autocomplete="current-password" />

        <div class="form-actions">
          <p id="login-status" role="status" aria-live="polite"></p>
          <button class="button button--primary button--xl" type="submit">
            <span class="btn-icon" aria-hidden="true">🔑</span>
            <span>Sign In</span>
          </button>
        </div>
      </form>

      <div class="cta-row" style="justify-content:center;margin-top:1rem;">
        <button id="btn-widget" class="button">Use Identity Widget</button>
        <a id="btn-forgot" class="button" href="#">Forgot Password</a>
      </div>

      <p class="muted" style="text-align:center;margin-top:1rem;">
        If login fails, try the widget (it opens Netlify’s built-in panel). Make sure you confirmed your email.
      </p>
    </div>
  </section>

  <!-- GoTrue + Identity helper + optional widget -->
  <script src="https://cdn.jsdelivr.net/npm/gotrue-js@2.3.0/dist/gotrue.min.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="js/identity.js"></script>
  <script>
    const statusEl = document.getElementById('login-status');
    const form = document.getElementById('login-form');
    const btnWidget = document.getElementById('btn-widget');
    const btnForgot = document.getElementById('btn-forgot');

    // Form login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Signing in...';
      const email = document.getElementById('l_user').value.trim();
      const password = document.getElementById('l_pass').value;
      const res = await TNKIdentity.login(email, password);
      if (res.ok) {
        sessionStorage.setItem('tnk_user_email', email);
        window.location.replace('customer.html');
      } else {
        statusEl.textContent = res.error || 'Login failed.';
      }
    });

    // Netlify Identity widget fallback (useful to verify setup)
    btnWidget.addEventListener('click', () => {
      if (window.netlifyIdentity) {
        netlifyIdentity.on('login', (user) => {
          try { sessionStorage.setItem('tnk_user_email', user?.email || ''); } catch {}
          window.location.replace('customer.html');
        });
        netlifyIdentity.open('login');
      } else {
        alert('Identity widget not available.');
      }
    });

    // Password reset
    btnForgot.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Enter your account email to reset password:');
      if (!email) return;
      const res = await TNKIdentity.requestPasswordRecovery(email.trim());
      alert(res.ok ? 'Check your email for a reset link.' : (res.error || 'Unable to send reset email.'));
    });

    // Helpful console breadcrumbs
    console.log('[Identity] API URL:', TNKIdentity.GoTrueURL);
  </script>
</body>
</html>
