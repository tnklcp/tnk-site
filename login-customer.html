<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <p>View invoices and account details.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <a class="button button--accent" href="customer-signup.html">Create Account</a>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:520px">
      <form id="login-form" novalidate>
        <label for="l_email">Email</label>
        <input id="l_email" name="email" type="email" required autocomplete="username" />

        <label for="l_pass">Password</label>
        <input id="l_pass" type="password" name="password" required autocomplete="current-password" />

        <div class="form-actions">
          <p id="login-status" role="status" aria-live="polite"></p>
          <button class="button button--primary button--xl" type="submit">
            <span class="btn-icon" aria-hidden="true">🔑</span>
            <span>Sign In</span>
          </button>
        </div>
      </form>

      <div class="cta-row" style="justify-content:center;margin-top:1rem;">
        <a id="btn-forgot" class="button" href="#">Forgot Password</a>
      </div>

      <p class="muted" style="text-align:center;margin-top:1rem;">
        Email confirmation is OFF—new accounts can sign in immediately.
      </p>
    </div>
  </section>

  <!-- GoTrue (Netlify Identity API) -->
  <script src="https://cdn.jsdelivr.net/npm/gotrue-js@2.3.0/dist/gotrue.min.js"></script>
  <script>
    // ---------- CONFIG ----------
    const DEST = '/customer.html'; // absolute path
    const APIUrl = window.location.origin + '/.netlify/identity';
    const auth = new GoTrue({ APIUrl, setCookie: true });

    const statusEl = document.getElementById('login-status');
    const form = document.getElementById('login-form');
    const btnForgot = document.getElementById('btn-forgot');

    // If already logged in, bounce to portal
    (async function autoRedirect() {
      try {
        const user = await auth.currentUser();
        if (user) {
          try { sessionStorage.setItem('tnk_user_email', user.email || ''); } catch {}
          window.location.replace(DEST);
        }
      } catch {}
    })();

    // Sign in
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Signing in…';
      const email = document.getElementById('l_email').value.trim();
      const password = document.getElementById('l_pass').value;

      try {
        const user = await auth.login(email, password, true);
        try { sessionStorage.setItem('tnk_user_email', user?.email || email); } catch {}
        // give the cookie a moment to land
        setTimeout(() => window.location.replace(DEST), 400);
      } catch (err) {
        let msg = (err && err.message) ? err.message : 'Login failed.';
        if (/invalid|Unauthorized/i.test(msg)) msg = 'Invalid email or password.';
        if (/confirm/i.test(msg)) msg = 'Please confirm your email before signing in.';
        statusEl.textContent = msg;
      }
    });

    // Password reset
    btnForgot.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Enter your account email to reset password:');
      if (!email) return;
      try {
        await auth.requestPasswordRecovery(email.trim());
        alert('Check your email for a reset link.');
      } catch (err) {
        alert('Unable to send reset email: ' + (err?.message || 'Unknown error'));
      }
    });
  </script>
</body>
</html>
