<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .center { text-align:center; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <p>Sign in to view invoices and account details.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <a class="button button--accent" href="customer-signup.html">Create Account</a>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:520px">
      <div class="center">
        <p id="login-status" class="muted" role="status" aria-live="polite">Opening secure login…</p>
        <button id="open-widget" class="button button--primary button--xl" type="button">
          <span class="btn-icon" aria-hidden="true">🔐</span>
          <span>Open Secure Login</span>
        </button>
        <p class="muted" style="margin-top:.75rem;">
          If the login window doesn’t appear, click the button above.
        </p>
      </div>
    </div>
  </section>

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const DEST = '/customer.html';       // absolute path
    const statusEl = document.getElementById('login-status');
    const btnOpen = document.getElementById('open-widget');

    // Poll helper to wait for session to be usable
    async function waitForUser(timeoutMs = 6000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        const user = netlifyIdentity.currentUser();
        if (user) return user;
        await new Promise(r => setTimeout(r, 300));
      }
      return null;
    }

    function gotoPortal(user) {
      try { sessionStorage.setItem('tnk_user_email', (user?.email || '')); } catch {}
      window.location.replace(DEST);
    }

    // Wire widget events
    if (window.netlifyIdentity) {
      netlifyIdentity.on('init', (user) => {
        console.log('[Identity] init:', user);
        if (user) {
          statusEl.textContent = 'Signed in. Redirecting…';
          gotoPortal(user);
        } else {
          // no user: open widget automatically
          netlifyIdentity.open('login');
        }
      });

      netlifyIdentity.on('login', async (user) => {
        console.log('[Identity] login:', user);
        statusEl.textContent = 'Signing you in…';
        // Sometimes cookies need a tick; wait briefly then redirect
        const ready = await waitForUser(4000);
        gotoPortal(ready || user);
      });

      netlifyIdentity.on('close', async () => {
        // If user logged in and widget closed quickly, ensure redirect
        const u = await waitForUser(2000);
        if (u) gotoPortal(u);
        else statusEl.textContent = 'Login window closed. Click "Open Secure Login" to try again.';
      });

      // Manual open button
      btnOpen.addEventListener('click', () => netlifyIdentity.open('login'));

      // Kick things off
      netlifyIdentity.init();
    } else {
      statusEl.textContent = 'Identity widget failed to load. Check your network/HTTPS.';
    }
  </script>
</body>
</html>
