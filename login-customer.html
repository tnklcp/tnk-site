<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <p>View invoices and account details.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <button id="btn-open" class="button button--accent">Sign In / Sign Up</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:560px">
      <p>Click “Sign In / Sign Up” to use our secure Netlify Identity login.</p>
    </div>
  </section>

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // If already logged in, go straight to customer page
    netlifyIdentity.on('init', user => {
      console.log('[Identity] init user:', user);
      if (user) window.location.replace('customer.html');
    });
    netlifyIdentity.init();

    // Open widget on button click
    document.getElementById('btn-open').addEventListener('click', () => {
      netlifyIdentity.open('login');
    });

    // After login, go to customer portal
    netlifyIdentity.on('login', user => {
      window.location.replace('customer.html');
    });

    // Optional: close widget on logout
    netlifyIdentity.on('logout', () => {
      // stay here
    });
  </script>
</body>
</html>
