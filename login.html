<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 400px at 50% -10%, rgba(231,125,4,.12), transparent 60%),
        var(--clr-bg);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: min(100%, 560px);
      background: var(--clr-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-2);
      padding: 1.5rem 1.25rem;
      text-align: center;
    }
    .auth-brand { display:grid; place-items:center; gap:.5rem; margin-bottom:.75rem; }
    .auth-brand img { width:86px; height:86px; border-radius:50%; object-fit:cover; border:4px solid color-mix(in srgb, var(--clr-accent) 25%, white); box-shadow: var(--shadow-1); }
    .muted { opacity:.85; font-size:.95rem; }
    .stack { display:grid; gap:.75rem; }
  </style>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <script>
    // Prevent redirect ping-pong
    function redirectOnce(url) {
      const now = Date.now();
      const last = Number(sessionStorage.getItem('tnk_redirect_lock') || 0);
      if (now - last < 1500) return;
      sessionStorage.setItem('tnk_redirect_lock', String(now));
      window.location.replace(url);
    }

    function getRole(user) {
      // Prefer app_metadata.roles (array), then user_metadata.role, then fallback
      const appRoles = user?.app_metadata?.roles;
      if (Array.isArray(appRoles) && appRoles.length) {
        if (appRoles.includes('admin')) return 'admin';
        if (appRoles.includes('employee')) return 'employee';
        if (appRoles.includes('customer')) return 'customer';
      }
      const metaRole = (user?.user_metadata?.role || '').toLowerCase();
      if (metaRole) return metaRole;
      // Employee portal defaults to employee when unknown
      return 'employee';
    }

    function routeAfterLogin(user) {
      const role = getRole(user);
      sessionStorage.setItem('tnk_user_email', (user?.email || '').toLowerCase());
      sessionStorage.setItem('tnk_role', role);
      if (role === 'admin') return redirectOnce('admin.html');
      if (role === 'employee') return redirectOnce('employee.html');
      return redirectOnce('customer.html');
    }

    function clearSession() {
      sessionStorage.removeItem('tnk_user_email');
      sessionStorage.removeItem('tnk_role');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!window.netlifyIdentity) return;

      netlifyIdentity.on('init', user => {
        // Already signed in? Route immediately.
        if (user) routeAfterLogin(user);
      });

      netlifyIdentity.on('login', user => {
        routeAfterLogin(user);
      });

      netlifyIdentity.on('logout', () => {
        clearSession();
        redirectOnce('login.html');
      });

      // Initialize widget
      netlifyIdentity.init();
    });
  </script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="images/IMG_2713.png" alt="">
        <h1 class="auth-title">Employee Portal</h1>
        <p class="muted">Admins: your role is set in Netlify Identity. Employees log in here.</p>
      </div>

      <div class="stack" style="margin-top:1rem">
        <button class="button button--primary button--xl" onclick="netlifyIdentity && netlifyIdentity.open('login')">
          <span class="btn-icon" aria-hidden="true">🔐</span>
          <span>Log In</span>
        </button>
        <a class="button" href="index.html">← Back to Site</a>
        <p class="muted">Need access? Ask an admin to invite you via Netlify Identity.</p>
      </div>
    </div>
  </div>
</body>
</html>
