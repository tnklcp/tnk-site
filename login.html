<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee/Admin Login | TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .loading { opacity:.85; text-align:center; margin-top:.5rem; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Employee / Admin Login</h1>
    <p>Staff access. Admins are routed to the Admin Portal.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <button id="btn-open" class="button button--accent">Secure Sign In</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:560px">
      <p>Use your invitation email. Roles are assigned in Netlify Identity.</p>
      <p id="msg" class="loading" role="status">Checking session…</p>
    </div>
  </section>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-open');

    function rolesOf(user){
      return (user && user.app_metadata && Array.isArray(user.app_metadata.roles))
        ? user.app_metadata.roles
        : [];
    }

    function routeByRole(user){
      const roles = rolesOf(user);
      if (roles.includes('admin')) {
        location.replace('admin.html');
      } else if (roles.includes('employee')) {
        location.replace('employee.html');
      } else {
        msg.textContent = 'Signed in, but no employee/admin role on this account.';
      }
    }

    // Wait for identity to initialize before doing anything
    function waitIdentity(){
      return new Promise((resolve) => {
        if (window.netlifyIdentity.currentUser()) {
          return resolve(window.netlifyIdentity.currentUser());
        }
        netlifyIdentity.on('init', resolve);
        netlifyIdentity.init();
      });
    }

    btn.addEventListener('click', () => {
      netlifyIdentity.open('login');
    });

    // Single, definitive redirect after login
    netlifyIdentity.on('login', (user) => {
      routeByRole(user);
    });

    // Initialize once and decide
    waitIdentity().then((user) => {
      if (user) {
        msg.textContent = 'Welcome back. Redirecting…';
        routeByRole(user);
      } else {
        msg.textContent = 'Not signed in.';
      }
    });
  </script>
</body>
</html>
