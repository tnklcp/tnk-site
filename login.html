<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee/Admin Login | TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Employee / Admin Login</h1>
    <p>Staff access. Admins are routed to the Admin Portal.</p>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Home</a>
      <button id="btn-open" class="button button--accent">Secure Sign In</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:560px">
      <p>Use your invitation email. Admins and employees are assigned roles in the dashboard.</p>
      <p id="msg" role="status"></p>
    </div>
  </section>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const msg = document.getElementById('msg');

    function routeByRole(user) {
      const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
      if (roles.includes('admin')) window.location.replace('admin.html');
      else if (roles.includes('employee')) window.location.replace('employee.html');
      else msg.textContent = 'You are signed in but do not have employee/admin access.';
    }

    netlifyIdentity.on('init', user => {
      if (user) routeByRole(user);
    });
    netlifyIdentity.init();

    document.getElementById('btn-open').addEventListener('click', () => {
      netlifyIdentity.open('login');
    });

    netlifyIdentity.on('login', user => routeByRole(user));
    netlifyIdentity.on('logout', () => { /* stay here */ });
  </script>
</body>
</html>
