<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | TNK Lawncare Plus</title>
  <meta name="description" content="Secure login for The Neighborhood Kids Lawncare Plus internal portals." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="login-shell">
  <a href="#login" class="visually-hidden-focusable">Skip to Login</a>

  <header class="hero" style="padding-bottom: 3rem;">
    <img src="images/IMG_2713.png" alt="The Neighborhood Kids Lawncare Plus Logo" width="260" height="260" decoding="async" />
    <h1>Internal Portal Login</h1>
    <p>Access the Admin or Employee portal with your credentials.</p>
  </header>

  <main class="login-main" id="login">
    <section class="section" style="padding-top: 2rem;">
      <div class="container">
        <div class="login-panel">
          <div class="login-actions">
            <p id="login-status" role="status" aria-live="polite"></p>
            <button id="login-button" class="button button--primary button--xl" type="button">Sign In with Auth0</button>
          </div>
          <div class="login-note" aria-live="polite">
            <strong>Secure access</strong>
            <p>Use your Auth0 credentials to reach the Admin or Employee portal.</p>
          </div>
          <div class="login-links">
            <a href="signup.html">Need an account? Sign up here.</a>
          </div>
          <p class="login-footer">Need help? Call <a href="tel:+15419214416">541-921-4416</a> or return to the <a href="index.html">main site</a>.</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
