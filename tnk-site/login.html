<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 400px at 50% -10%, rgba(231,125,4,.12), transparent 60%),
        var(--clr-bg);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: min(100%, 560px);
      background: var(--clr-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-2);
      padding: 1.5rem 1.25rem;
      text-align: center;
    }
    .auth-brand { display:grid; place-items:center; gap:.5rem; margin-bottom:.75rem; }
    .auth-brand img { width:86px; height:86px; border-radius:50%; object-fit:cover; border:4px solid color-mix(in srgb, var(--clr-accent) 25%, white); box-shadow: var(--shadow-1); }
    .muted { opacity:.85; font-size:.95rem; }
    .stack { display:grid; gap:.75rem; }
  </style>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <script src="js/identity.js" defer></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="images/IMG_2713.png" alt="">
        <h1 class="auth-title">Employee Portal</h1>
        <p class="muted">Admins & employees log in here.</p>
      </div>

      <div class="stack" style="margin-top:1rem">
        <button class="button button--primary button--xl" id="open-login">
          <span class="btn-icon" aria-hidden="true">🔐</span>
          <span>Log In</span>
        </button>
        <a class="button" href="index.html">← Back to Site</a>
        <p class="muted">Need access? Ask an admin to invite you via Netlify Identity.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      TNKIdentity.init({
        onInit(user) {
          // If already logged in, route once (no page-level races)
          if (user) TNKIdentity.routeAfterLogin(user);
        },
        onLogin(user) {
          TNKIdentity.routeAfterLogin(user);
        }
      });

      document.getElementById("open-login").addEventListener("click", () => {
        if (window.netlifyIdentity) netlifyIdentity.open("login");
      });
    });
  </script>
</body>
</html>
