<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome — Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .wrap { max-width: 680px; margin: 3rem auto; padding: 1.25rem; }
    .card { background: var(--clr-surface); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 1.25rem; }
    .muted { opacity: .85; }
    .log { background: #00000008; border: 1px solid #e6e1d6; padding: .75rem; border-radius: 8px; min-height: 120px; white-space: pre-wrap; }
  </style></head>
<body>
  <header class="hero">
    <h1>Welcome</h1>
    <p>Let’s finish setting up your account.</p>
  </header>

  <main class="wrap">
    <div class="card">
      <p class="muted">If you were invited or just verified your email, we’ll complete your signup and send you to the right portal.</p>
      <div id="status" class="muted" style="margin:.5rem 0 1rem;"></div>
      <div id="actions">
        <button class="button button--primary" id="open-login">Open Login</button>
        <a class="button" href="index.html">← Back to Home</a>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
    </div>
  </main>

  <!-- Identity widget + helpers -->
  
  <script src="js/identity.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const actions = document.getElementById('actions');
    let identityAvailable = true;
    const log = (m) => { logEl.textContent += (m + '\n'); };
    const getIdentity = () => window.netlifyIdentity || null;

    function routeByRole(user) {
      const roles = user?.app_metadata?.roles || [];
      if (roles.includes('admin')) return location.replace('admin.html');
      if (roles.includes('employee')) return location.replace('employee.html');
      if (roles.includes('customer')) return location.replace('customer.html');
      // default fallback
      return location.replace('index.html#portals');
    }

    // Parse tokens from hash or query
    function getToken(name) {
      const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      const q = new URLSearchParams(location.search || '');
      return h.get(name) || q.get(name);
    }

    document.getElementById('open-login').addEventListener('click', () => {
      if (!identityAvailable) return;
      const id = getIdentity();
      if (!id) return;
      try { id.open('login'); } catch {}
    });

    // Core: accept invites / confirmations and route
    (async function init() {
      statusEl.textContent = 'Initializing…';
      await TNKIdentity.init({
        autoRoute: false,
        onError() {
          identityAvailable = false;
          statusEl.textContent = 'Identity unavailable. Please try again later.';
          const btn = document.getElementById('open-login');
          if (btn) {
            btn.disabled = true;
            btn.textContent = 'Identity unavailable';
          }
        }
      });

      const identity = getIdentity();
      if (!identity) {
        identityAvailable = false;
        statusEl.textContent = 'Identity unavailable. Please try again later.';
        return;
      }

      const invite = getToken('invite_token');
      const confirm = getToken('confirmation_token') || getToken('token');

      if (invite) {
        log('Invite token found. Accepting…');
        statusEl.textContent = 'Accepting your invite…';
        try {
          const user = await identity.acceptInvite(invite, true);
          log('Invite accepted. Signed in as ' + (user && user.email));
          statusEl.textContent = 'Invite accepted. Redirecting…';
          return routeByRole(user);
        } catch (e) {
          log('Invite error: ' + (e && e.message || e));
          statusEl.textContent = 'Invite acceptance failed. Please click “Open Login”.';
          try { identity.open('login'); } catch {}
          return;
        }
      }

      if (confirm) {
        // Some providers send a confirmation token; widget usually handles it,
        // but we open the login to finalize the session.
        log('Confirmation token detected.');
        statusEl.textContent = 'Email confirmed. Finalizing…';
        try { identity.open('login'); } catch {}
        return;
      }

      // No tokens: if already logged-in, route now; else show login button
      const current = TNKIdentity.user();
      if (current) {
        log('Already signed in as ' + current.email);
        statusEl.textContent = 'Signed in. Redirecting…';
        return routeByRole(current);
      } else {
        log('No token detected. Use the button to log in or sign up.');
        statusEl.textContent = 'Click “Open Login” to continue.';
      }
    })();

    if (getIdentity()) {
      getIdentity().on('login', (user) => {
        statusEl.textContent = 'Signed in. Redirecting…';
        routeByRole(user);
      });
      getIdentity().on('error', (e) => log('Identity error: ' + (e && e.message || e)));
    }
  </script>
</body>
</html>
