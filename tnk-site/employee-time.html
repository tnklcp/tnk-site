<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Tracking | Employee Portal</title>
  <meta name="description" content="Employee time tracking for TNK Lawncare Plus." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/employee-portal.js" defer></script>
</head>
<body>
  <header class="hero" style="padding-bottom: 3rem;">
    <h1>Time Tracking</h1>
    <p>Clock in/out for overall hours and review your time logs.</p>
    <div class="cta-row">
      <a class="button button--primary" href="employee.html">Return to Employee Portal</a>
      <button class="button button--accent" type="button" id="employee-logout">Log Out</button>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 1.5rem;">
      <div class="container">
        <p class="login-footer" id="employee-user">Loading employee profile...</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="portal-grid">
          <article class="portal-card">
            <div class="portal-icon">TT</div>
            <h3 class="portal-title">Clock In / Out</h3>
            <span class="status-pill" id="employee-clock-status">Clocked out</span>
            <form id="employee-time-form" class="form-grid">
              <div class="field">
                <label for="time-notes">Notes</label>
                <input id="time-notes" name="notes" type="text" />
              </div>
              <div class="form-actions">
                <button class="button button--primary" type="submit" data-action="clock_in">Clock In</button>
                <button class="button button--accent" type="submit" data-action="clock_out">Clock Out</button>
              </div>
            </form>
            <ul id="employee-time-list" class="portal-list"></ul>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
