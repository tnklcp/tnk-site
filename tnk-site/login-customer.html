<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Portal — Login | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-wrap {
      min-height: 100dvh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1200px 400px at 50% -10%, rgba(231,125,4,.12), transparent 60%),
        var(--clr-bg);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: min(100%, 560px);
      background: var(--clr-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-2);
      padding: 1.5rem 1.25rem;
      text-align:center;
    }
    .auth-brand { display:grid; place-items:center; gap:.5rem; margin-bottom:.75rem; }
    .auth-brand img { width:86px; height:86px; border-radius:50%; object-fit:cover; border:4px solid color-mix(in srgb, var(--clr-accent) 25%, white); box-shadow: var(--shadow-1); }
    .auth-title { margin:0; color: var(--clr-primary-600); }
    .muted { opacity:.85; font-size:.95rem; }
    .stack { display:grid; gap:.75rem; }
  </style>
  

  <script src="js/identity.js" defer></script></head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="images/IMG_2713.png" alt="Neighborhood Kids Lawncare Plus logo" />
        <h1 class="auth-title">Customer Portal</h1>
        <p class="muted">View invoices, request services, and manage your account.</p>
      </div>

      <div class="stack" style="margin-top:1rem">
        <button class="button button--primary button--xl" id="open-login">
          <span class="btn-icon" aria-hidden="true">🔐</span>
          <span>Log In</span>
        </button>
        <button class="button" id="open-signup">
          <span class="btn-icon" aria-hidden="true">✨</span>
          <span>Create Account</span>
        </button>
        <a class="button" href="index.html">← Back to Home</a>
        <p class="muted">No verification email? Check spam or try again.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginBtn = document.getElementById("open-login");
      const signupBtn = document.getElementById("open-signup");
      const disableAuth = (message) => {
        if (loginBtn) {
          loginBtn.disabled = true;
          loginBtn.textContent = message;
        }
        if (signupBtn) {
          signupBtn.disabled = true;
          signupBtn.textContent = message;
        }
      };

      const assignCustomerRole = async (user) => {
        if (!user) return;
        try {
          const token = await user.jwt(true);
          if (!token) return;
          await fetch("/.netlify/functions/identity_assign_role", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            }
          });
        } catch (err) {
          console.warn("Customer role assignment failed.", err);
        }
      };

      TNKIdentity.init({
        autoRoute: false, // IMPORTANT: prevents redirect race

        onInit(user) {
          if (user) assignCustomerRole(user).finally(() => TNKIdentity.routeAfterLogin(user));
        },

        onLogin(user) {
          assignCustomerRole(user).finally(() => TNKIdentity.routeAfterLogin(user));
        },

        onLogout() {
          location.replace("login-customer.html");
        },

        onError() {
          disableAuth("Identity unavailable");
        }
      });

      loginBtn?.addEventListener("click", () => {
        if (window.netlifyIdentity) netlifyIdentity.open("login");
      });
      signupBtn?.addEventListener("click", () => {
        if (window.netlifyIdentity) netlifyIdentity.open("signup");
      });
    });
  </script>
</body>
</html>
