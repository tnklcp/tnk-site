<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay Period History | Admin Portal</title>
  <meta name="description" content="Admin pay period history for TNK Lawncare Plus." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/admin-portal.js" defer></script>
</head>
<body>
  <header class="hero" style="padding-bottom: 3rem;">
    <h1>Pay Period History</h1>
    <p>View each employee's hours in their own tab.</p>
    <div class="cta-row">
      <a class="button button--primary" href="admin.html">Return to Admin Portal</a>
      <button class="button button--accent" type="button" id="admin-logout">Log Out</button>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 1.5rem;">
      <div class="container">
        <p class="login-footer" id="admin-user">Loading admin profile...</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <article class="portal-card portal-card--wide">
          <div class="portal-icon">PP</div>
          <h3 class="portal-title">Employee Tabs</h3>
          <p class="portal-text">Select a tab to see pay periods and total hours for that employee only.</p>
          <p class="portal-note" id="admin-pay-period-range"></p>
          <div class="tab-shell">
            <div class="tab-list" role="tablist" aria-label="Employees" id="admin-pay-period-tabs"></div>
            <div class="tab-panel" role="tabpanel" id="admin-pay-period-panel" aria-live="polite">
              <strong id="admin-pay-period-tab-title">Pay periods</strong>
              <ul id="admin-pay-period-tab-list" class="portal-list"></ul>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
