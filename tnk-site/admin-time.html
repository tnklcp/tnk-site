<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time Tracking | Admin Portal</title>
  <meta name="description" content="Admin time tracking for TNK Lawncare Plus." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/admin-portal.js" defer></script>
</head>
<body>
  <header class="hero" style="padding-bottom: 3rem;">
    <h1>Time Tracking</h1>
    <p>Monitor hours by employee, job, and date range.</p>
    <div class="cta-row">
      <a class="button button--primary" href="admin.html">Return to Admin Portal</a>
      <button class="button button--accent" type="button" id="admin-logout">Log Out</button>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 1.5rem;">
      <div class="container">
        <p class="login-footer" id="admin-user">Loading admin profile...</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="portal-grid">
          <article class="portal-card">
            <div class="portal-icon">TT</div>
            <h3 class="portal-title">Time Logs</h3>
            <p class="portal-text">Latest clock-ins and clock-outs.</p>
            <ul id="admin-time-list"></ul>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
