<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Portal | TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .grid { display:grid; gap:1rem; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .card { background:#fffaf0; border-radius:12px; box-shadow: var(--shadow-1); padding:1rem; }
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { border-bottom:1px solid #e9e2cf; padding:.6rem; text-align:left; }
    .badge { padding:.2rem .5rem; border-radius:8px; font-size:.85rem; }
    .b-unpaid { background:#fff3cd; color:#9a6a00; }
    .b-paid { background:#d1f7c4; color:#195d00; }
    .thumbs { display:flex; flex-wrap:wrap; gap:.5rem; }
    .thumbs img { width:88px; height:66px; object-fit:cover; border-radius:8px; box-shadow:var(--shadow-1); }
    @media (max-width: 900px){ .grid-2{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Customer Portal</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button id="btn-logout" class="button">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <p id="hello" style="opacity:.9;margin-top:0;">Checking session…</p>

      <div class="grid grid-2">
        <!-- Account Balance -->
        <div class="card">
          <h3>Account Balance</h3>
          <p>Use this wallet to pay ahead for upcoming services.</p>
          <p><strong>Balance: <span id="balance">$0.00</span></strong></p>
          <form id="balance-form" class="inline" style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
            <label>Add Funds ($)</label>
            <input id="bal_amount" type="number" min="0" step="1" style="max-width:140px" required />
            <button class="button button--primary" type="submit">Add</button>
          </form>
          <p id="bal_status" role="status" style="margin-top:.35rem;opacity:.9;"></p>
        </div>

        <!-- Service Preferences -->
        <div class="card">
          <h3>My Service Preferences</h3>
          <form id="prefs-form">
            <label><strong>Tier</strong></label>
            <select id="pref_tier" required>
              <option value="">Select…</option>
              <option>Essential</option>
              <option>Standard</option>
              <option>Premium</option>
            </select>

            <label style="margin-top:.5rem;"><strong>Add-Ons</strong></label>
            <div class="option-grid option-grid--2">
              <label class="option-btn"><span>Shrub &amp; Plant Pruning</span><input type="checkbox" value="Pruning" /></label>
              <label class="option-btn"><span>Collect &amp; Bag Debris</span><input type="checkbox" value="Debris" /></label>
              <label class="option-btn"><span>Hand-Weeding Beds</span><input type="checkbox" value="Bed Weeding" /></label>
              <label class="option-btn"><span>Fertilization</span><input type="checkbox" value="Fertilization" /></label>
            </div>

            <div class="inline" style="margin-top:.75rem;">
              <button class="button button--primary" type="submit">Save Preferences</button>
              <p id="pref_status" role="status" style="margin:0 0 0 .5rem;"></p>
            </div>
          </form>
        </div>

        <!-- Invoices -->
        <div class="card" style="grid-column: 1 / -1;">
          <h3>My Invoices</h3>
          <table class="table" id="inv-table">
            <thead><tr><th>#</th><th>Issued</th><th>Due</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody></tbody>
          </table>
          <p id="inv_status" role="status" style="margin-top:.35rem;"></p>
        </div>

        <!-- Request Extra Service -->
        <div class="card">
          <h3>Request Additional Service</h3>
          <form id="extra-form">
            <label for="x_service">Service</label>
            <input id="x_service" required placeholder="e.g., One-time Cleanup" />
            <label for="x_date">Preferred Date</label>
            <input id="x_date" type="date" />
            <label for="x_notes">Notes</label>
            <textarea id="x_notes" rows="3" placeholder="Access, pets, gate code, etc."></textarea>
            <div class="inline" style="margin-top:.6rem;">
              <button class="button button--primary" type="submit">Send Request</button>
              <p id="extra_status" role="status" style="margin:0 0 0 .5rem;"></p>
            </div>
          </form>
        </div>

        <!-- Service History + Leave Feedback -->
        <div class="card">
          <h3>Service History</h3>
          <div id="history"><p style="opacity:.8">No completed services yet.</p></div>
          <hr style="margin:1rem 0;border:none;border-top:1px solid #e6dfcc;" />
          <h4>Leave Feedback</h4>
          <form id="fb-form">
            <label for="fb_job">Job</label>
            <select id="fb_job" required></select>
            <label for="fb_text">Your Comment</label>
            <textarea id="fb_text" rows="3" required placeholder="How did we do?"></textarea>
            <div class="inline" style="margin-top:.6rem;">
              <button class="button" type="submit">Submit Feedback</button>
              <p id="fb_status" role="status" style="margin:0 0 0 .5rem;"></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    // === tiny store helpers
    const store = {
      get(k, f){ try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } },
      set(k, v){ localStorage.setItem(k, JSON.stringify(v)); },
    };

    // keys
    const K = {
      invoices: 'tnk_invoices',
      balances: 'tnk_balances',
      prefs:    'tnk_prefs',
      extras:   'tnk_extra_requests',
      jobs:     'tnk_jobs',
      feedback: 'tnk_job_feedback'
    };

    const hello = document.getElementById('hello');
    const balanceEl = document.getElementById('balance');

    function money(n){ return `$${Number(n||0).toFixed(2)}`; }

    function waitIdentity(){
      return new Promise((resolve)=>{
        const cur = netlifyIdentity.currentUser && netlifyIdentity.currentUser();
        if (cur) return resolve(cur);
        netlifyIdentity.on('init', resolve);
        netlifyIdentity.init();
      });
    }

    function userEmail(u){ return (u?.email || '').toLowerCase(); }

    function loadBalance(email){
      const all = store.get(K.balances, {});
      return Number(all[email] || 0);
    }
    function saveBalance(email, amt){
      const all = store.get(K.balances, {});
      all[email] = Number(amt||0);
      store.set(K.balances, all);
    }

    function renderInvoices(email){
      const tbody = document.querySelector('#inv-table tbody');
      const status = document.getElementById('inv_status');
      const all = store.get(K.invoices, []);
      const rows = all.filter(i => (i.customer_email||'').toLowerCase() === email)
                      .sort((a,b)=> (a.date<b.date?1:-1));
      tbody.innerHTML = '';
      if(rows.length===0){ status.textContent = 'No invoices yet.'; return; }
      status.textContent = '';
      rows.forEach(i=>{
        const total = i.total ?? (i.amount_cents ? i.amount_cents/100 : 0);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i.number}</td>
          <td>${i.date || ''}</td>
          <td>${i.due || ''}</td>
          <td>${money(total)}</td>
          <td><span class="badge ${i.status==='paid'?'b-paid':'b-unpaid'}">${i.status||'unpaid'}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPrefs(email){
      const p = store.get(K.prefs, {});
      const my = p[email] || {};
      document.getElementById('pref_tier').value = my.tier || '';
      const checks = [...document.querySelectorAll('#prefs-form input[type="checkbox"]')];
      checks.forEach(c => c.checked = (my.addons||[]).includes(c.value));
    }

    function renderHistory(email){
      const wrap = document.getElementById('history');
      const jobs = store.get(K.jobs, []).filter(j => (j.customer_email||'').toLowerCase()===email && j.status==='completed');
      const select = document.getElementById('fb_job');
      select.innerHTML = '<option value="">Select a completed job…</option>';

      if(jobs.length===0){ wrap.innerHTML = '<p style="opacity:.8">No completed services yet.</p>'; return; }

      wrap.innerHTML = '';
      jobs.forEach(j=>{
        const div = document.createElement('div');
        div.style.marginBottom = '.75rem';
        const imgs = (j.photos||[]).map(src => `<img src="${src}" alt="" />`).join('');
        div.innerHTML = `
          <div><strong>${j.date || ''}</strong> — ${j.title || 'Service'}</div>
          <div class="thumbs">${imgs || ''}</div>
          ${j.employee_notes ? `<div style="opacity:.85;margin-top:.25rem;"><em>Tech note:</em> ${j.employee_notes}</div>` : ''}
        `;
        wrap.appendChild(div);

        const opt = document.createElement('option');
        opt.value = j.id;
        opt.textContent = `${j.date || ''} — ${j.title || 'Service'}`;
        select.appendChild(opt);
      });
    }

    // ===== main
    const logoutBtn = document.getElementById('btn-logout');
    logoutBtn.addEventListener('click', ()=> netlifyIdentity.logout());
    netlifyIdentity.on('logout', ()=> location.replace('login-customer.html'));

    waitIdentity().then(user=>{
      if(!user) return location.replace('login-customer.html');
      const email = userEmail(user);
      hello.textContent = `Welcome, ${user.user_metadata?.full_name || user.email}`;

      // balance
      const bal = loadBalance(email);
      balanceEl.textContent = money(bal);

      // invoices / prefs / history
      renderInvoices(email);
      renderPrefs(email);
      renderHistory(email);

      // add funds
      const balForm = document.getElementById('balance-form');
      const balAmt = document.getElementById('bal_amount');
      const balStatus = document.getElementById('bal_status');
      balForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        const add = Number(balAmt.value || 0);
        const newTotal = Number(loadBalance(email) + add);
        saveBalance(email, newTotal);
        balanceEl.textContent = money(newTotal);
        balStatus.textContent = 'Updated.';
        balForm.reset();
      });

      // save prefs
      const prefForm = document.getElementById('prefs-form');
      const prefStatus = document.getElementById('pref_status');
      prefForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        const tier = document.getElementById('pref_tier').value;
        const addons = [...document.querySelectorAll('#prefs-form input[type="checkbox"]:checked')].map(i=>i.value);
        const p = store.get(K.prefs, {});
        p[email] = { tier, addons };
        store.set(K.prefs, p);
        prefStatus.textContent = 'Saved.';
      });

      // extra service request
      const extraForm = document.getElementById('extra-form');
      const extraStatus = document.getElementById('extra_status');
      extraForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        const data = {
          id: crypto.randomUUID(),
          email,
          service: document.getElementById('x_service').value.trim(),
          date: document.getElementById('x_date').value || '',
          notes: document.getElementById('x_notes').value.trim(),
          created_at: new Date().toISOString()
        };
        const list = store.get(K.extras, []);
        list.push(data); store.set(K.extras, list);
        extraStatus.textContent = 'Request sent (saved locally for now).';
        extraForm.reset();
      });

      // feedback
      const fbForm = document.getElementById('fb-form');
      const fbStatus = document.getElementById('fb_status');
      fbForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        const jobId = document.getElementById('fb_job').value;
        const text = document.getElementById('fb_text').value.trim();
        if(!jobId){ fbStatus.textContent='Pick a job.'; return; }
        const list = store.get(K.feedback, []);
        list.push({ id: crypto.randomUUID(), job_id: jobId, email, text, created_at: new Date().toISOString() });
        store.set(K.feedback, list);
        fbStatus.textContent = 'Thanks for the feedback!';
        fbForm.reset();
      });
    });
  </script>
</body>
</html>
