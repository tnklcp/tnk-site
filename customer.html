<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { border-bottom:1px solid #ddd; padding:.6rem; text-align:left; }
    .badge { padding:.2rem .5rem; border-radius:8px; font-size:.85rem; }
    .b-unpaid { background:#fff3cd; color:#9a6a00; }
    .b-paid { background:#d1f7c4; color:#195d00; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>My Account</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button id="btn-logout" class="button">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:900px">
      <h2 id="hello">Welcome</h2>

      <h3>Your Invoices</h3>
      <table class="table" id="inv-table">
        <thead>
          <tr><th>#</th><th>Issued</th><th>Due</th><th>Amount</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="inv-status" role="status" style="margin-top:10px;"></p>
    </div>
  </section>

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const hello = document.getElementById('hello');
    const tbody = document.querySelector('#inv-table tbody');
    const invStatus = document.getElementById('inv-status');

    // Simple demo: invoices from localStorage for now
    const store = {
      get(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
    };

    function money(n){ return `$${Number(n||0).toFixed(2)}`; }

    function loadInvoicesFor(email) {
      const all = store.get('tnk_invoices', []);
      return all.filter(i => (i.customer_email || '').toLowerCase() === email.toLowerCase());
    }

    function renderInvoices(email) {
      const mine = loadInvoicesFor(email);
      tbody.innerHTML = '';
      if (mine.length === 0) {
        invStatus.textContent = 'No invoices yet.';
        return;
      }
      invStatus.textContent = '';
      mine.sort((a,b) => (a.date < b.date ? 1 : -1)).forEach(i => {
        const tr = document.createElement('tr');
        const total = i.total ?? (i.amount_cents ? (i.amount_cents/100) : 0);
        tr.innerHTML = `
          <td>${i.number}</td>
          <td>${i.date || ''}</td>
          <td>${i.due || ''}</td>
          <td>${money(total)}</td>
          <td><span class="badge ${i.status==='paid'?'b-paid':'b-unpaid'}">${i.status || 'unpaid'}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Auth gate
    netlifyIdentity.on('init', user => {
      if (!user) {
        window.location.replace('login-customer.html');
        return;
      }
      hello.textContent = `Welcome, ${user.user_metadata?.full_name || user.email}`;
      renderInvoices(user.email);
    });
    netlifyIdentity.init();

    document.getElementById('btn-logout').addEventListener('click', () => {
      netlifyIdentity.logout();
    });

    netlifyIdentity.on('logout', () => {
      window.location.replace('login-customer.html');
    });
  </script>
</body>
</html>
