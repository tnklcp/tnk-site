<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Invoices | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { border-bottom:1px solid #ddd; padding:.6rem; text-align:left; }
    .badge { padding:.2rem .5rem; border-radius:8px; font-size:.85rem; }
    .b-unpaid { background:#fff3cd; color:#9a6a00; }
    .b-paid { background:#d1f7c4; color:#195d00; }
    .empty { opacity:.8; text-align:center; padding:1rem 0; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>My Invoices</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button class="button" id="logout">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:900px">
      <div id="auth-guard" style="text-align:center; margin-bottom:1rem; display:none;">
        <p>You’re not signed in.</p>
        <a class="button button--primary" href="login-customer.html">Go to Customer Login</a>
      </div>

      <table class="table" id="inv-table" aria-live="polite">
        <thead>
          <tr><th>#</th><th>Issued</th><th>Due</th><th>Amount</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="inv-status" role="status" style="margin-top:10px;"></p>
    </div>
  </section>

  <!-- GoTrue (Netlify Identity API) -->
  <script src="https://cdn.jsdelivr.net/npm/gotrue-js@2.3.0/dist/gotrue.min.js"></script>
  <script>
    // ---------- Identity ----------
    const APIUrl = window.location.origin + '/.netlify/identity';
    const auth = new GoTrue({ APIUrl, setCookie: true });

    const guard = document.getElementById('auth-guard');
    const logoutBtn = document.getElementById('logout');
    const invTbody = document.querySelector('#inv-table tbody');
    const invStatus = document.getElementById('inv-status');

    function money(n){ return `$${Number(n || 0).toFixed(2)}`; }

    // Local “DB” (same keys used in your admin.html)
    const store = {
      get(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) ?? fallback; }catch{ return fallback; } },
      set(key, value){ localStorage.setItem(key, JSON.stringify(value)); }
    };
    const KEYS = {
      invoices: 'tnk_invoices'
    };

    async function requireUser() {
      try {
        const user = await auth.currentUser();
        if (user && user.email) {
          sessionStorage.setItem('tnk_user_email', user.email);
          return user;
        }
      } catch {}
      return null;
    }

    function renderInvoicesFor(email) {
      invTbody.innerHTML = '';
      const all = store.get(KEYS.invoices, []);
      const mine = all.filter(i => (i.customer_email||'').toLowerCase() === email.toLowerCase());

      if (mine.length === 0) {
        invTbody.innerHTML = `<tr><td colspan="6" class="empty">No invoices yet.</td></tr>`;
        return;
      }

      mine
        .sort((a,b)=> (a.date < b.date ? 1 : -1))
        .forEach(inv => {
          const total = inv.total ?? (inv.amount_cents ? (inv.amount_cents/100) : 0);
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${inv.number}</td>
            <td>${inv.date || ''}</td>
            <td>${inv.due || ''}</td>
            <td>${money(total)}</td>
            <td><span class="badge ${inv.status==='paid' ? 'b-paid':'b-unpaid'}">${inv.status}</span></td>
            <td>
              <button class="button" data-view="${inv.id}">View</button>
            </td>
          `;
          invTbody.appendChild(tr);
        });
    }

    function openInvoiceWindow(inv){
      const styles = `
        <style>
          body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; color:#1e2f1e; }
          h1,h2,h3 { margin:0 0 6px; }
          .head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px; }
          .brand { display:flex; align-items:center; gap:12px; }
          .brand img { width:64px; height:64px; border-radius:12px; }
          .meta { text-align:right; }
          .muted { opacity:.8; }
          table { width:100%; border-collapse:collapse; margin-top: 12px; }
          th, td { border-bottom:1px solid #e8e1d6; padding:8px; text-align:left; }
          tfoot td { border-top:2px solid #cfc7b6; font-weight:700; }
          .totals { max-width:360px; margin-left:auto; }
          .actions { margin-top: 18px; }
          button { padding:.5rem .9rem; border-radius:8px; border:1px solid #cfcfcf; background:#fff; cursor:pointer; }
        </style>
      `;
      const money = (n)=>`$${Number(n||0).toFixed(2)}`;
      const rows = (inv.items||[]).map(it=>`
        <tr><td>${it.desc||''}</td><td>${it.qty||0}</td><td>${money(it.unit||0)}</td><td>${money((it.qty||0)*(it.unit||0))}</td></tr>
      `).join('');
      const html = `
        <!doctype html><html><head><meta charset="utf-8"><title>${inv.number}</title>${styles}</head><body>
        <div class="head">
          <div class="brand">
            <img src="images/IMG_2713.png" alt="">
            <div>
              <h2>The Neighborhood Kids Lawncare Plus</h2>
              <div class="muted">Serving Pacific City to Depoe Bay • 541-921-4416 • TNKLCP@gmail.com</div>
            </div>
          </div>
          <div class="meta">
            <h1>${inv.number}</h1>
            <div>Date: ${inv.date||''}</div>
            <div>Due: ${inv.due||''}</div>
            <div>Status: ${inv.status}</div>
          </div>
        </div>

        <div><strong>Bill To:</strong> ${inv.customer_email}</div>

        <table>
          <thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="muted">No items</td></tr>'}</tbody>
        </table>

        <table class="totals">
          <tbody>
            <tr><td>Subtotal</td><td style="text-align:right;">${money(inv.subtotal||0)}</td></tr>
            <tr><td>Tax (${(inv.tax_pct||0).toFixed(2)}%)</td><td style="text-align:right;">${money(inv.tax||0)}</td></tr>
          </tbody>
          <tfoot><tr><td>Total</td><td style="text-align:right;">${money(inv.total||0)}</td></tr></tfoot>
        </table>

        ${inv.notes ? `<p class="muted">Notes: ${inv.notes}</p>` : ''}

        <div class="actions"><button onclick="window.print()">Print / Save PDF</button></div>
        </body></html>
      `;
      const win = window.open('', '_blank');
      win.document.open(); win.document.write(html); win.document.close();
      try { win.focus(); } catch {}
    }

    invTbody.addEventListener('click', (e) => {
      const id = e.target?.dataset?.view;
      if (!id) return;
      const all = store.get(KEYS.invoices, []);
      const inv = all.find(x => x.id === id);
      if (inv) openInvoiceWindow(inv);
    });

    logoutBtn.addEventListener('click', async () => {
      try { await auth.logout(); } catch {}
      sessionStorage.removeItem('tnk_user_email');
      window.location.replace('login-customer.html');
    });

    // ---------- Boot ----------
    (async function init(){
      const user = await requireUser();
      if (!user) {
        guard.style.display = 'block'; // show a friendly prompt instead of hard redirect loop
        document.getElementById('inv-table').style.display = 'none';
        return;
      }
      renderInvoicesFor(user.email);
    })();
  </script>
</body>
</html>
