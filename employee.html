<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal | TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Keep it consistent with your site */
    .table { width:100%; border-collapse: collapse; background:#fff; }
    .table th, .table td { border-bottom:1px solid #eee5d3; padding:.6rem; text-align:left; }
    .badge { padding:.2rem .5rem; border-radius:8px; font-size:.85rem; }
    .b-pending { background:#fff3cd; color:#9a6a00; }
    .b-approved { background:#d1f7c4; color:#195d00; }
    .muted { opacity:.85; }

    /* Hide the page until auth gate finishes to avoid flicker / race */
    body.locked { visibility: hidden; }
    .card { background: var(--clr-surface); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 1rem; }
    .grid-2 { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:1rem; }
    @media (max-width: 900px){ .grid-2{ grid-template-columns: 1fr; } }
  </style>
  <!-- Identity widget (safe to include; no-op if Identity not enabled) -->
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body class="locked">
  <header class="hero">
    <h1>Employee Portal</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button id="logout" class="button">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:1100px">
      <div class="grid-2">
        <!-- ===== Today's Jobs (read-only) ===== -->
        <div class="card">
          <h2>Today’s Jobs</h2>
          <p class="muted" id="jobs-note">These are the jobs assigned to you.</p>
          <div class="table-wrap" style="overflow:auto;border:1px solid #e6e1d6;border-radius:12px;">
            <table class="table">
              <thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Start</th><th>Status</th><th>Action</th></tr></thead>
              <tbody id="jobs-tbody"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>

        <!-- ===== Submit Hours ===== -->
        <div class="card">
          <h2>Add Hours</h2>
          <form id="hours-form" novalidate>
            <label>Date</label>
            <input type="date" name="work_date" required />

            <label>Hours</label>
            <input type="number" name="hours" min="0" max="24" step="0.25" required />

            <label>Notes (optional)</label>
            <textarea name="notes" rows="3" placeholder="Tasks performed, locations, etc."></textarea>

            <div class="form-actions">
              <p id="status" role="status" class="muted"></p>
              <button class="button button--primary" type="submit">Save Entry</button>
            </div>
          </form>
        </div>
      </div>

      <!-- ===== Your Recent Hours ===== -->
      <h2 style="text-align:center;margin-top:2rem">Your Recent Entries</h2>
      <div class="table-wrap" style="overflow:auto;border:1px solid #e6e1d6;border-radius:12px;">
        <table class="table" id="hours-table">
          <thead><tr><th>Date</th><th>Hours</th><th>Status</th><th>Notes</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <script>
    /***************
     * AUTH GATE
     * - Only allow role === 'employee' or 'admin'
     * - Uses (1) Netlify Identity (if enabled) and your Accounts list,
     *   with (2) sessionStorage fallbacks used elsewhere in your site.
     ***************/
    const store = {
      get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
    };
    const KEYS = { accounts: 'tnk_accounts', jobs: 'tnk_jobs', jobQueue:'tnk_job_queue', timesheets:'tnk_timesheets' };

    function currentIdentityEmail(){
      try {
        if (window.netlifyIdentity) {
          const u = window.netlifyIdentity.currentUser();
          if (u && u.email) return String(u.email).toLowerCase();
        }
      } catch {}
      const se = sessionStorage.getItem('tnk_user_email');
      return se ? String(se).toLowerCase() : null;
    }

    function roleFromAccounts(email){
      if (!email) return null;
      const acc = store.get(KEYS.accounts, []);
      const hit = acc.find(a => (a.email||'').toLowerCase() === email);
      return hit ? hit.role : null;
    }

    function roleFromSession(){
      const r = sessionStorage.getItem('tnk_role');
      return r || null;
    }

    function allowEmployee(){
      const email = currentIdentityEmail();
      const roleAcc = roleFromAccounts(email);
      const roleSess = roleFromSession();

      // Priority: a real account role if present, else session fallback.
      const role = roleAcc || roleSess;

      if (role === 'employee' || role === 'admin') return true;
      return false;
    }

    async function robustLogoutAndToLogin() {
      try { await fetch('/.netlify/identity/logout', { method:'POST' }); } catch {}
      sessionStorage.removeItem('tnk_user_email');
      sessionStorage.removeItem('tnk_role');
      try { localStorage.removeItem('gotrue.user'); } catch {}
      try { localStorage.removeItem('netlify-cms-user'); } catch {}
      window.location.replace('login.html?for=employee');
    }

    async function ensureAuth(){
      // Delay until identity initializes (if present), but cap to avoid races
      const start = Date.now();
      while (window.netlifyIdentity && !window.netlifyIdentity.currentUser() && Date.now() - start < 1000) {
        await new Promise(r => setTimeout(r, 50));
      }

      if (!allowEmployee()) {
        // Not authorized → kick to employee login
        window.location.replace('login.html?for=employee');
        return false;
      }
      // Authorized → show page
      document.body.classList.remove('locked');
      return true;
    }

    /***************
     * LOGOUT (robust)
     ***************/
    document.getElementById('logout').addEventListener('click', robustLogoutAndToLogin);

    /***************
     * PAGE LOGIC (only runs after auth passes)
     ***************/
    function meEmail(){
      return currentIdentityEmail();
    }

    function renderJobs(){
      const email = meEmail();
      const tbody = document.getElementById('jobs-tbody');
      const all = store.get(KEYS.jobs, []);
      const today = new Date().toISOString().slice(0,10);
      const mine = all
        .filter(j => (j.assignee_email||'').toLowerCase() === email)
        .filter(j => j.date >= today)            // show today and upcoming
        .sort((a,b)=> (a.date < b.date ? -1 : 1) || (a.start||'') < (b.start||'') ? -1 : 1);

      if (mine.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">No jobs assigned.</td></tr>';
        return;
      }

      tbody.innerHTML = mine.map(j => `
        <tr data-id="${j.id}">
          <td>${j.date}</td>
          <td>${j.customer_name || j.customer_email}</td>
          <td>${j.service || ''}</td>
          <td>${j.start || ''}</td>
          <td>${j.status || 'scheduled'}</td>
          <td>
            ${j.status === 'submitted' ? '<span class="muted">Pending approval</span>' : `
              <button class="button" data-complete="${j.id}">Mark Complete</button>
              <label class="button" style="margin-left:.25rem;">
                Upload Photos
                <input type="file" accept="image/*" data-photos="${j.id}" multiple style="display:none" />
              </label>
            `}
          </td>
        </tr>
      `).join('');
    }

    // Handle complete + photos
    document.addEventListener('change', (e) => {
      const id = e.target?.dataset?.photos;
      if (!id) return;
      const files = [...e.target.files || []].slice(0, 8);
      if (files.length === 0) return;

      const jobs = store.get(KEYS.jobs, []);
      const j = jobs.find(x => x.id === id);
      if (!j) return;
      j.photos = j.photos || [];

      const readerPromises = files.map(f => new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result); // base64 data URL (demo only)
        r.readAsDataURL(f);
      }));

      Promise.all(readerPromises).then(imgs => {
        j.photos.push(...imgs);
        store.set(KEYS.jobs, jobs);
        renderJobs();
      });
    });

    document.addEventListener('click', (e) => {
      const id = e.target?.dataset?.complete;
      if (!id) return;
      const jobs = store.get(KEYS.jobs, []);
      const j = jobs.find(x => x.id === id);
      if (!j) return;

      // Move a snapshot into the admin queue
      const queue = store.get(KEYS.jobQueue, []);
      queue.push({
        id: j.id,
        date: j.date,
        service: j.service,
        customer_email: j.customer_email,
        customer_name: j.customer_name,
        assignee_email: j.assignee_email,
        notes: j.notes || '',
        photos: j.photos || []
      });
      store.set(KEYS.jobQueue, queue);

      // Mark job as submitted
      j.status = 'submitted';
      store.set(KEYS.jobs, jobs);
      renderJobs();
      alert('Job submitted for admin review.');
    });

    // ===== Timesheets (local demo) =====
    function renderHours(){
      const email = meEmail();
      const tbody = document.querySelector('#hours-table tbody');
      const all = store.get(KEYS.timesheets, []).filter(r => (r.employee_email||'').toLowerCase() === email);
      if (all.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="muted">No entries yet.</td></tr>';
        return;
      }
      tbody.innerHTML = all
        .sort((a,b)=> (a.date < b.date ? 1 : -1))
        .map(r => `
          <tr data-id="${r.id}">
            <td>${r.date}</td>
            <td>${Number(r.hours || ((timeToHrs(r.end_time) - timeToHrs(r.start_time))||0)).toFixed(2)}</td>
            <td><span class="badge ${r.approved ? 'b-approved':'b-pending'}">${r.approved?'approved':'pending'}</span></td>
            <td>${(r.notes||'').replace(/</g,'&lt;')}</td>
            <td>${r.approved ? '' : '<button class="button" data-edit="'+r.id+'">Edit</button>'}</td>
          </tr>
        `).join('');
    }
    function timeToHrs(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h+(m||0)/60; }

    document.querySelector('#hours-table tbody').addEventListener('click', (e) => {
      const id = e.target?.dataset?.edit;
      if (!id) return;
      const email = meEmail();
      const rows = store.get(KEYS.timesheets, []);
      const i = rows.findIndex(r => r.id === id && (r.employee_email||'').toLowerCase() === email);
      if (i < 0) return;
      const h = prompt('New hours (0–24):', rows[i].hours ?? '');
      if (h === null) return;
      const notes = prompt('Notes (optional):', rows[i].notes || '');
      rows[i].hours = Number(h);
      rows[i].notes = notes || '';
      store.set(KEYS.timesheets, rows);
      renderHours();
    });

    document.getElementById('hours-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = meEmail();
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Saving…';

      const fd = new FormData(e.target);
      const rec = {
        id: crypto.randomUUID(),
        employee_email: email,
        date: fd.get('work_date'),
        hours: Number(fd.get('hours') || 0),
        notes: String(fd.get('notes') || ''),
        approved: false
      };
      const rows = store.get(KEYS.timesheets, []);
      rows.push(rec);
      store.set(KEYS.timesheets, rows);
      e.target.reset();
      statusEl.textContent = 'Saved.';
      renderHours();
      setTimeout(()=> statusEl.textContent = '', 1200);
    });

    // ===== Boot
    (async () => {
      const ok = await ensureAuth();
      if (!ok) return;
      renderJobs();
      renderHours();
    })();
  </script>
</body>
</html>
