<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Hours | Neighborhood Kids Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { border-bottom:1px solid #ddd; padding:.6rem; text-align:left; }
    .badge { padding:.2rem .5rem; border-radius:8px; font-size:.85rem; }
    .b-pending { background:#fff3cd; color:#9a6a00; }
    .b-approved { background:#d1f7c4; color:#195d00; }
    .b-rejected { background:#ffd6d6; color:#a30000; }
  </style>
</head>
<body>
  <!-- Auth Gate -->
  <script>
    function redirectOnce(url) {
      const now = Date.now();
      const last = Number(sessionStorage.getItem('tnk_redirect_lock') || 0);
      if (now - last < 1500) return;
      sessionStorage.setItem('tnk_redirect_lock', String(now));
      window.location.replace(url);
    }
    (function authGate() {
      const role = sessionStorage.getItem('tnk_role');
      if (role === 'employee') return;                 // ok
      if (role === 'admin') return redirectOnce('admin.html');
      redirectOnce('login.html');
    })();
  </script>

  <header class="hero">
    <h1>My Hours</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button class="button" id="logout">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:820px">
      <form id="hours-form">
        <label>Date</label>
        <input type="date" name="work_date" required />

        <label>Hours</label>
        <input type="number" name="hours" min="0" max="24" step="0.25" required />

        <label>Notes (optional)</label>
        <textarea name="notes" rows="3" placeholder="Tasks performed, locations, etc."></textarea>

        <button class="button" type="submit">Add Entry</button>
        <p id="status" role="status" style="margin-top:10px;"></p>
      </form>

      <h2 style="text-align:center;margin-top:2rem">Your Recent Entries</h2>
      <table class="table" id="hours-table">
        <thead><tr><th>Date</th><th>Hours</th><th>Status</th><th>Notes</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script>
    // Demo-only logout
    document.getElementById('logout').onclick = async () => {
      sessionStorage.removeItem('tnk_role');
      sessionStorage.removeItem('tnk_user_email');
      redirectOnce('login.html');
    };

    const form = document.getElementById('hours-form');
    const statusEl = document.getElementById('status');
    const tbody = document.querySelector('#hours-table tbody');

    // Local storage keys (demo)
    const store = {
      get(k, f){ try { return JSON.parse(localStorage.getItem(k)) ?? f; } catch { return f; } },
      set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
    };
    const K = { timesheets:'tnk_timesheets' };

    async function loadHours() {
      const email = sessionStorage.getItem('tnk_user_email') || '';
      const rows = store.get(K.timesheets, []).filter(r => (r.employee_email||'') === email);
      tbody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.work_date}</td>
          <td>${r.hours}</td>
          <td><span class="badge b-${r.status||'pending'}">${r.status||'pending'}</span></td>
          <td>${(r.notes||'').replace(/</g,'&lt;')}</td>
          <td>${r.status === 'pending' ? '<button class="button" data-edit="'+r.id+'">Edit</button>' : ''}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    tbody.addEventListener('click', (e) => {
      const id = e.target?.dataset?.edit;
      if (!id) return;
      const all = store.get(K.timesheets, []);
      const item = all.find(x => x.id === id);
      if (!item) return;
      const hours = prompt('New hours (0–24):', item.hours);
      const notes = prompt('Notes (optional):', item.notes || '');
      if (hours === null) return;
      item.hours = Number(hours);
      item.notes = notes;
      store.set(K.timesheets, all);
      loadHours();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      statusEl.textContent = 'Saving...';
      const email = sessionStorage.getItem('tnk_user_email') || '';
      const data = {
        id: crypto.randomUUID(),
        employee_email: email,
        work_date: form.work_date.value,
        hours: Number(form.hours.value || 0),
        notes: form.notes.value.trim(),
        status: 'pending'
      };
      const list = store.get(K.timesheets, []);
      list.push(data);
      store.set(K.timesheets, list);
      statusEl.textContent = 'Saved.';
      form.reset();
      loadHours();
    });

    loadHours();
  </script>
</body>
</html>
