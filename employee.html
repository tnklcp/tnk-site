<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Portal — TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .loading { opacity:.85; text-align:center; margin-top:.5rem; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Employee Portal</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button id="logout" class="button">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:1000px">
      <p id="who" class="loading">Checking access…</p>
      <div id="content" style="display:none">
        <div class="admin-grid" style="display:grid;grid-template-columns:1fr;gap:1rem;">
          <div class="admin-card">
            <h2>Welcome</h2>
            <p>You are signed in with <strong>employee</strong> (or <strong>admin</strong>) role.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const who = document.getElementById('who');
    const content = document.getElementById('content');

    function rolesOf(user){
      return (user && user.app_metadata && Array.isArray(user.app_metadata.roles))
        ? user.app_metadata.roles
        : [];
    }

    function allowEmployee(user){
      const roles = rolesOf(user);
      return roles.includes('employee') || roles.includes('admin');
    }

    function waitIdentity(){
      return new Promise((resolve) => {
        const cur = window.netlifyIdentity.currentUser && window.netlifyIdentity.currentUser();
        if (cur) return resolve(cur);
        netlifyIdentity.on('init', resolve);
        netlifyIdentity.init();
      });
    }

    document.getElementById('logout').addEventListener('click', () => {
      netlifyIdentity.logout();
    });

    netlifyIdentity.on('logout', () => {
      location.replace('login.html');
    });

    // Main flow
    waitIdentity().then((user) => {
      if (!user) {
        // Not logged in → go to login once (no loop)
        location.replace('login.html');
        return;
      }
      if (!allowEmployee(user)) {
        // Logged in but not employee/admin → back to login with widget
        location.replace('login.html');
        return;
      }
      who.textContent = `Signed in as ${user.email}`;
      content.style.display = 'block';
    });
  </script>
</body>
</html>
