<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Portal — TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1>Admin Portal</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button id="logout" class="button">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:1000px">
      <p id="who" style="opacity:.9"></p>
      <div class="admin-grid" style="display:grid;grid-template-columns:1fr;gap:1rem;">
        <div class="admin-card">
          <h2>Welcome</h2>
          <p>This is a placeholder Admin area. You are seeing this because your Netlify Identity user has the <strong>admin</strong> role.</p>
          <ul>
            <li>Manage accounts, hours, promotions, prices, and invoices (to be wired later).</li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const who = document.getElementById('who');

    function requireAdmin(user) {
      const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
      if (!user || !roles.includes('admin')) {
        // not admin → go to employee login
        window.location.replace('login.html');
        return false;
      }
      return true;
    }

    netlifyIdentity.on('init', user => {
      if (requireAdmin(user)) {
        who.textContent = `Signed in as ${user.email} (admin)`;
      }
    });
    netlifyIdentity.init();

    document.getElementById('logout').addEventListener('click', () => {
      netlifyIdentity.logout();
    });

    netlifyIdentity.on('logout', () => {
      window.location.replace('login.html');
    });
  </script>
</body>
</html>
