<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Portal — TNK Lawncare Plus</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .loading { opacity:.85; text-align:center; margin-top:.5rem; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Admin Portal</h1>
    <div class="cta-row">
      <a class="button" href="index.html">← Back to Site</a>
      <button id="logout" class="button">Log Out</button>
    </div>
  </header>

  <section class="section">
    <div class="container" style="max-width:1000px">
      <p id="who" class="loading">Checking access…</p>
      <div id="content" style="display:none">
        <div class="admin-grid" style="display:grid;grid-template-columns:1fr;gap:1rem;">
          <div class="admin-card">
            <h2>Welcome</h2>
            <p>You are signed in with the <strong>admin</strong> role.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const who = document.getElementById('who');
    const content = document.getElementById('content');

    function isAdmin(user){
      const roles = (user && user.app_metadata && Array.isArray(user.app_metadata.roles))
        ? user.app_metadata.roles
        : [];
      return roles.includes('admin');
    }

    function waitIdentity(){
      return new Promise((resolve) => {
        const cur = window.netlifyIdentity.currentUser && window.netlifyIdentity.currentUser();
        if (cur) return resolve(cur);
        netlifyIdentity.on('init', resolve);
        netlifyIdentity.init();
      });
    }

    document.getElementById('logout').addEventListener('click', () => {
      netlifyIdentity.logout();
    });

    netlifyIdentity.on('logout', () => {
      location.replace('login.html');
    });

    waitIdentity().then((user) => {
      if (!user) {
        location.replace('login.html');
        return;
      }
      if (!isAdmin(user)) {
        location.replace('login.html');
        return;
      }
      who.textContent = `Signed in as ${user.email} (admin)`;
      content.style.display = 'block';
    });
  </script>
</body>
</html>


  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    const who = document.getElementById('who');

    function requireAdmin(user) {
      const roles = (user && user.app_metadata && user.app_metadata.roles) || [];
      if (!user || !roles.includes('admin')) {
        // not admin → go to employee login
        window.location.replace('login.html');
        return false;
      }
      return true;
    }

    netlifyIdentity.on('init', user => {
      if (requireAdmin(user)) {
        who.textContent = `Signed in as ${user.email} (admin)`;
      }
    });
    netlifyIdentity.init();

    document.getElementById('logout').addEventListener('click', () => {
      netlifyIdentity.logout();
    });

    netlifyIdentity.on('logout', () => {
      window.location.replace('login.html');
    });
  </script>
</body>
</html>
